# Cloudflare Worker da Academia Única MAX (mesmo padrão do ADM MAX).
# O Nitro (preset cloudflare-module) lê este arquivo no build e completa main/assets/flags.
name = "academia-unica-max"
compatibility_date = "2026-10-01"

# Preserva variáveis/segredos configurados no painel entre deploys.
keep_vars = true

# Variáveis públicas (não são segredo). Preencher na fase de publicação com a URL
# e a publishable key do Supabase do ADM MAX. NUNCA colocar service_role aqui:
# use `wrangler secret put SUPABASE_SERVICE_ROLE_KEY`.
[vars]
# SUPABASE_URL = "https://<ref-adm>.supabase.co"
# SUPABASE_PUBLISHABLE_KEY = "sb_publishable_..."
# VITE_SITE_URL = "https://<dominio-definitivo>"

# Vídeo (Cloudflare Stream). Enquanto o Stream não for ativado, use o modo simulado
# só em homologação: ACADEMIA_VIDEO_MOCK = "true". Em produção deixe "false".
# ACADEMIA_VIDEO_MOCK = "false"
# STREAM_CUSTOMER_CODE = "<código do subdomínio customer-XXXX.cloudflarestream.com>"
# Segredos (NUNCA aqui; só via `wrangler secret put`):
#   STREAM_SIGNING_KEY_ID   -> "id" devolvido por POST /accounts/{id}/stream/keys
#   STREAM_SIGNING_KEY_JWK  -> "jwk" (base64) devolvido pela mesma chamada
